<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="short icon" href="../imagens/favicon/favicon.ico">
    <link rel="stylesheet" type="text/css" href="../estilos/layout.css">
    <link rel="stylesheet" href="../estilos/formulario.css">
    <script>
        let nome = prompt("Informe seu nome: ")
        //console.log("Seja bem vindo "+ nome + " nas aventuras com JS");
        alert("Seja bem vindo" + nome + " nas aventuras com JS");
    </script>
</head>
<body>
    <header>
        <figure>
            <img class="logo" src="../imagens/imagens/rs.jpg"/>
        </figure>
        <h1>Biel</h1>
    </header>
    <nav>
        <ul>
            <li><a href="../index.html"> Página principal </a></li>
            <li><a href="../paginas/sobre.html"> Sobre </a></li>
            <li><a href="#"> Contatos </a></li>
        </ul>
    </nav>
    <main>
        <section id="forms" class="form">
            <fieldset>
                <legend>Formulario de Contato</legend>
                <form id="Formulario" action="../paginas/respFormulario.html" method="post">
                    <label for="nome">Nome </label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite Seu Nome">
                    
                    <label for="email">Email </label>
                    <input type="email" id="email" name="email" required placeholder="Digite Seu Email">
                    
                    <label for="mensagem">Mensagem </label>
                    <textarea type="text" name="mensagem" id="mensagem" rows="5" required> </textarea>
                    
                    <label for="motivo">Motivo de Contrato </label>
                    <select name="motivo" id="motivo">
                        <option value="Suporte">Suporte</option>
                        <option value="Vendas">Vendas</option>
                        <option value="Serviço">Serviço</option>
                        <option value="Feedback">Feedback</option>
                        <option value="Outro">Outro</option>
                    </select>
                    <input type="submit" id="submit">
                </form>
            </fieldset>
            
        </section>
    </main>
    <footer>
        <p>Rodapé da Página</p>
        <p>Desenvolvido por Gabriell Rodrigues &copy;2026</p>
    </footer>
</body>
</html>
